name: Bug report
description: Report a reproducible problem in Kiln
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before opening a new report.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kiln version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework and version
      placeholder: Astro 7.2.4
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest reproduction or commands that demonstrate the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Bun version, and target if relevant.
    validations:
      required: true
