name: ci

on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "examples/**"
      - "assets/**"
      - ".github/workflows/ci.yml"
      - "README.md"
      - "LICENSE"
      - "package.json"
      - "bun.lock"
  push:
    branches:
      - main
      - refactor/**
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check-types

      - name: Build compiler
        run: bun run build

      - name: Run unit tests
        run: bun test packages/kiln/tests

      - name: Build documentation
        run: bun run docs:build
