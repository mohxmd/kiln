name: ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "examples/**"
      - "assets/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - ".github/CODEOWNERS"
      - ".github/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "RELEASING.md"
      - "SECURITY.md"
      - "README.md"
      - "LICENSE"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "bun.lock"
  push:
    branches:
      - main
      - refactor/**
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build workspace
        run: bun run build

      - name: Run unit tests
        run: bun test packages/kiln/tests
